<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>WorkBuddy 控制台</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e6e8ec; --line2:#f0f1f4;
    --ink:#1b1f24; --ink2:#5b6470; --ink3:#8b94a1;
    --ok:#0f9d58; --okbg:#e8f6ee; --warn:#b26a00; --warnbg:#fdf3e2;
    --bad:#d93025; --badbg:#fdecea; --acc:#2b6cb0; --accbg:#e8f1fb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171a; --card:#1c2025; --line:#2b3138; --line2:#23282e;
      --ink:#e8eaed; --ink2:#a7b0bb; --ink3:#7c8695;
      --ok:#43c07a; --okbg:#16301f; --warn:#e0a44a; --warnbg:#33280f;
      --bad:#f0776c; --badbg:#33191a; --acc:#6aa9e9; --accbg:#16273a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px 48px}
  h1{font-size:19px;margin:6px 0 2px;font-weight:650}
  .sub{color:var(--ink3);font-size:12.5px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;margin-bottom:12px}
  .card h2{font-size:13.5px;margin:0 0 10px;font-weight:600;color:var(--ink2)}
  label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
  input[type=password],input[type=text]{width:100%;padding:11px 12px;font-size:15px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  input:focus{outline:2px solid var(--acc);outline-offset:-1px}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
  button{flex:1;min-width:132px;padding:12px 14px;font-size:15px;font-weight:600;
    border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.985)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.ghost{font-weight:500;color:var(--ink2)}
  button:disabled{opacity:.5;cursor:default}
  .hint{font-size:12px;color:var(--ink3);margin-top:9px;line-height:1.5}
  .tag{display:inline-block;font-size:11.5px;padding:2.5px 8px;border-radius:6px;
    background:var(--line2);color:var(--ink2);margin-right:6px;white-space:nowrap}
  .tag.ok{background:var(--okbg);color:var(--ok)}
  .tag.warn{background:var(--warnbg);color:var(--warn)}
  .tag.bad{background:var(--badbg);color:var(--bad)}
  .tag.acc{background:var(--accbg);color:var(--acc)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
    border-bottom:1px solid var(--line2);font-size:13.5px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--ink3);flex:none}
  .kv .v{text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
  .steps{list-style:none;padding:0;margin:0}
  .steps li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
    border-bottom:1px solid var(--line2);font-size:13.5px}
  .steps li:last-child{border-bottom:none}
  .steps .n{color:var(--ink2)}
  .steps .r{color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
  .runs a{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line2);text-decoration:none;
    color:inherit;font-size:13.5px}
  .runs a:last-child{border-bottom:none}
  .runs .t{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .22s;max-width:88vw;text-align:center}
  .toast.on{opacity:.95}
  .loading{color:var(--ink3);font-size:13.5px;padding:8px 0}
  /* 账号卡：每账号一块，左名右数、下方积分条。手机上单列，宽屏两列。 */
  .accts{display:grid;grid-template-columns:1fr;gap:9px}
  @media (min-width:560px){ .accts{grid-template-columns:1fr 1fr} }
  .acct{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--bg)}
  .acct.locked{border-color:var(--warn);background:var(--warnbg)}
  .acct.off{opacity:.6}
  .acct .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .acct .nm{font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct .pr{font-size:11px;color:var(--ink3);flex:none}
  .acct .cr{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;
    display:flex;align-items:baseline;gap:4px}
  .acct .cr .of{font-size:12px;font-weight:400;color:var(--ink3)}
  .cbar{height:4px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
  .cbar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
  .cbar.low i{background:var(--warn)}
  .cbar.crit i{background:var(--bad)}
  .acct .lock{margin-top:7px;font-size:11.5px;color:var(--warn)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:10px}
  .hidden{display:none}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    background:var(--line2);padding:1.5px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>WorkBuddy 控制台</h1>
  <div class="sub" id="repoLine">—</div>

  <!-- 访问密钥：这一页是公开的、不含任何秘密；密钥由你输入、只存在本机浏览器。
       别人打开这页什么都干不了，因为它没有密钥。 -->
  <div class="card" id="authCard">
    <h2>访问密钥</h2>
    <label>粘贴你的 GitHub 访问令牌（只保存在本机浏览器，不会上传到本页面）</label>
    <input type="password" id="token" placeholder="github_pat_… 或 ghp_…" autocomplete="off">
    <div class="row">
      <button class="primary" id="btnSave">保存并进入</button>
      <button class="ghost" id="btnClear">清除</button>
    </div>
    <div class="hint">
      令牌只需 <b>Actions: Read and write</b>（本仓库）。保存后浏览器会记住，以后不用再输。<br>
      安全性：本页面是纯静态页、**不存储也不转发**你的令牌；所有请求都由你的浏览器直连 GitHub。
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h2>操作</h2>
      <div class="row">
        <button class="primary" id="btnRun">立即跑一次全量任务</button>
        <button id="btnRefresh">刷新状态</button>
      </div>
      <div class="hint">跑一次约 1 分钟：签到 → 保活 → 活跃 → 旅行 → 夜猫子 → 连登抽奖 → 开学季 → 余额 → 成长任务。</div>
    </div>

    <div class="card">
      <h2>最近一次结果</h2>
      <div id="status"><div class="loading">加载中…</div></div>
    </div>

    <div class="card">
      <h2>运行历史</h2>
      <div class="runs" id="runs"><div class="loading">加载中…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 部署时改这两行即可指向任意仓库。
const OWNER = 'fasfqwr12';
const REPO  = 'workbuddy2api-panel';
const WORKFLOW = 'tasks.yml';
const LS_KEY = 'wb.token';

const API = 'https://api.github.com';
const $ = id => document.getElementById(id);

let token = localStorage.getItem(LS_KEY) || '';

function toast(msg, ms) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), ms || 2600);
}

function headers() {
  return {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };
}

async function api(path, opts) {
  const r = await fetch(API + path, Object.assign({ headers: headers() }, opts || {}));
  if (r.status === 401 || r.status === 403) {
    throw new Error('密钥无效或权限不足（需要 Actions: Read and write）');
  }
  if (r.status === 404) throw new Error('读不到（仓库不存在，或密钥没有该仓库的权限）');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.status === 204 ? null : r.json();
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 状态文件是 base64 编码的（GitHub Contents API 约定），且可能较新 ->
// 用 raw media type 直接取原文，省一次解码。
async function loadStatus() {
  const box = $('status');
  try {
    const r = await fetch(`${API}/repos/${OWNER}/${REPO}/contents/status/latest.json`, {
      headers: Object.assign(headers(), { 'Accept': 'application/vnd.github.raw' }),
    });
    if (r.status === 404) {
      box.innerHTML = '<div class="loading">还没有结果文件——先点上面的「立即跑一次」。</div>';
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = JSON.parse(await r.text());

    // 概览行
    let html = '';
    html += `<div class="kv"><span class="k">更新时间</span><span class="v">${fmtTime(d.updated)}</span></div>`;
    html += `<div class="kv"><span class="k">触发方式</span><span class="v">${
      d.trigger === 'workflow_dispatch' ? '手动' : d.trigger === 'schedule' ? '定时' : (d.trigger || '—')}</span></div>`;
    html += `<div class="kv"><span class="k">账号数</span><span class="v">${d.account_count ?? '—'}</span></div>`;
    if (d.queue) {
      const q = d.queue;
      const bad = q.failed > 0;
      html += `<div class="kv"><span class="k">任务队列</span><span class="v">共 ${q.total} · 成功 ${q.done} · ${
        bad ? '<span style="color:var(--bad)">失败 ' + q.failed + '</span>' : '失败 0'} · 跳过 ${q.skipped}</span></div>`;
    }
    box.innerHTML = html;

    // 阶段清单：逐条列出，一眼看出哪步做了、哪步跳了
    if (Array.isArray(d.steps) && d.steps.length) {
      const ul = document.createElement('ul');
      ul.className = 'steps';
      ul.innerHTML = d.steps.map(s => {
        const skipped = s.result.startsWith('跳过') || s.result.startsWith('未执行');
        return `<li><span class="n">${esc(s.name)}</span>
          <span class="r" style="${skipped ? 'color:var(--warn)' : 'color:var(--ok)'}">${esc(s.result)}</span></li>`;
      }).join('');
      box.appendChild(ul);
    }

    // 账号卡：每个号的积分、优先级、限流锁定一目了然
    if (Array.isArray(d.accounts) && d.accounts.length) {
      const h = document.createElement('div');
      h.innerHTML = '<h2 style="margin:16px 0 9px">账号状态</h2><div class="accts">' +
        d.accounts.map(a => {
          const total = a.credits_total || 0;
          const pct = total > 0 ? Math.min(100, Math.round((a.credits || 0) / total * 100)) : 0;
          const lvl = pct >= 30 ? '' : pct >= 10 ? 'low' : 'crit';
          const locked = (a.locked_models || []).length > 0;
          const lockTxt = (a.locked_models || []).map(m => {
            const t = m.until ? new Date(m.until) : null;
            const p = n => String(n).padStart(2, '0');
            const when = t ? `${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}` : '';
            return `🔒 ${esc(String(m.model).replace(/^(cn|global):/, ''))} ${when}`;
          }).join('<br>');
          return `<div class="acct ${locked ? 'locked' : ''} ${a.disabled ? 'off' : ''}">
            <div class="top">
              <span class="nm">${esc(a.nickname || a.uid.slice(0, 8))}</span>
              <span class="pr">优先 ${a.priority ?? 0}</span>
            </div>
            <div class="cr">${a.credits ?? '—'}${total > 0 ? `<span class="of">/ ${total}</span>` : ''}</div>
            ${total > 0 ? `<div class="cbar ${lvl}"><i style="width:${pct}%"></i></div>` : ''}
            ${locked ? `<div class="lock">${lockTxt}</div>` : ''}
            ${a.disabled ? '<div class="lock">已禁用</div>' : ''}
          </div>`;
        }).join('') + '</div>' +
        '<div class="legend"><span>🔒 = 该模型的用量配额已耗尽，到点自动解锁</span><span>条 = 积分剩余 / 总额</span></div>';
      box.appendChild(h);
    }
  } catch (e) {
    box.innerHTML = '<div class="loading">读取失败：' + esc(e.message) + '</div>';
  }
}

async function loadRuns() {
  const box = $('runs');
  try {
    const d = await api(`/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=8`);
    const runs = d.workflow_runs || [];
    if (!runs.length) { box.innerHTML = '<div class="loading">还没有运行记录</div>'; return; }
    box.innerHTML = runs.map(r => {
      const st = r.status === 'completed'
        ? (r.conclusion === 'success' ? '<span class="tag ok">成功</span>'
          : r.conclusion === 'cancelled' ? '<span class="tag warn">已取消</span>'
          : '<span class="tag bad">失败</span>')
        : '<span class="tag acc">运行中</span>';
      // 直接用 GitHub 的运行页：日志、完整输出都在那里，手机上也能看。
      return `<a href="${r.html_url}" target="_blank" rel="noopener">
        <span>${st}<span style="color:var(--ink3);font-size:12.5px">#${r.run_number}</span></span>
        <span class="t">${fmtTime(r.created_at)}</span></a>`;
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="loading">读取失败：' + esc(e.message) + '</div>';
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function showApp(on) {
  $('authCard').classList.toggle('hidden', on);
  $('app').classList.toggle('hidden', !on);
  $('repoLine').textContent = on ? `${OWNER}/${REPO}` : '公开页面 · 需要访问密钥才能操作';
}

async function enter() {
  showApp(true);
  await Promise.all([loadStatus(), loadRuns()]);
}

$('btnSave').onclick = async () => {
  const v = $('token').value.trim();
  if (!v) { toast('请先粘贴密钥'); return; }
  token = v;
  localStorage.setItem(LS_KEY, v);
  $('token').value = '';
  try {
    await api(`/repos/${OWNER}/${REPO}`);
  } catch (e) {
    localStorage.removeItem(LS_KEY); token = '';
    toast(e.message, 4200); return;
  }
  toast('已保存');
  enter();
};

$('btnClear').onclick = () => {
  localStorage.removeItem(LS_KEY); token = '';
  showApp(false); toast('已清除本机保存的密钥');
};

$('btnRefresh').onclick = () => { loadStatus(); loadRuns(); toast('已刷新'); };

$('btnRun').onclick = async () => {
  const b = $('btnRun');
  b.disabled = true; b.textContent = '已提交，等待启动…';
  try {
    // workflow_dispatch 用工作流文件名触发；ref 用默认分支。
    await api(`/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
      { method: 'POST', body: JSON.stringify({ ref: 'main' }) });
    toast('已触发，约 1 分钟后出结果');
    // 给 GitHub 一点排队时间再刷新，避免立刻拉到旧的运行记录。
    setTimeout(() => { loadRuns(); }, 6000);
    setTimeout(() => { loadStatus(); loadRuns(); }, 75000);
  } catch (e) {
    toast('触发失败：' + e.message, 4200);
  } finally {
    b.disabled = false; b.textContent = '立即跑一次全量任务';
  }
};

if (token) { enter(); } else { showApp(false); }
</script>
</body>
</html>
